name: Validate prototypes and publish live demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npm run validate
        working-directory: demo
      - run: npm run validate:screenshots
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - name: Stage live demo at its declared path
        run: |
          mkdir -p pages/demo
          cp -R demo/dist/. pages/demo/
          cp demo/dist/mission-surface-deployment.json pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy fixture-only live bundle
        id: deployment
        uses: actions/deploy-pages@v4
